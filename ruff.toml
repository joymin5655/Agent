# Python lint config. Pinned rule list so a ruff upgrade cannot silently change what is checked
# (verdict behaviour can still differ per version; the gate baseline is built with 0.16.5).
# Type hints (ANN) are enforced separately as a no-growth ratchet: core/tests/ruff-gate.sh.
target-version = "py39"
exclude = ["legacy"]

[lint]
select = ["E4", "E7", "E9", "F"]
